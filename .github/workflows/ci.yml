name: CI

on:
  push:
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m compileall -q core application.py
      - run: python -m pytest -q tests/test_solver.py tests/test_catalogs.py

  freecad-integration:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Run tests/freecad_smoke.py in a pinned FreeCAD image before enabling."
